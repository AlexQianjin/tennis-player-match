[project]
name = "tennis-match-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36,<2.2",
    "asyncmy>=0.2.10",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "apscheduler>=3.11,<4",
    "openai>=1.50",
    "tzdata",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "respx>=0.21",
    "testcontainers[mysql]>=4",
    "ruff>=0.8",
]

[project.scripts]
tennis-match-api = "tennis_match_api.main:main"
tennis-match-migrate = "tennis_match_api.scripts.migrate:main"
tennis-match-seed = "tennis_match_api.scripts.seed:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "migrations"]
extend-exclude = ["*.mako"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["Depends", "Query", "File", "Form", "Header", "Path", "Security"]

[tool.ruff.lint.isort]
known-first-party = ["tennis_match_api"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
