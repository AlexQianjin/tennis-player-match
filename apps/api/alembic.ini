[alembic]
# %(here)s is this file's directory. A bare relative path is resolved from the
# process cwd. The image installs the app into site-packages and does not run
# Alembic from that directory.
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
path_separator = os
sqlalchemy.url = mysql+asyncmy://tennis:tennis@127.0.0.1:3306/tennis

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
